[project]
name = "aviapars"
version = "0.1.0"
description = "Personal Telegram bot that tracks flight and train ticket prices"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "selectolax>=0.3.21",
    "curl_cffi>=0.7",
    "pydantic-settings[yaml]>=2.5",
    "tzdata>=2024.1",  # zoneinfo has no IANA db on Windows; harmless no-op on Linux
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviapars"]
