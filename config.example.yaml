# Non-secret, tunable settings. Safe to commit and read over someone's shoulder.
# Secrets (tokens, keys) live in .env instead — see .env.example.
# Copy this file to config.yaml and adjust; config.yaml is gitignored so local
# tuning doesn't collide with the tracked example.

# путь к файлу SQLite базы данных
db_path: /var/lib/aviapars/aviapars.db

# список стран (ISO-коды), для которых сидируется справочник places при первом запуске
seed_countries: [RU]

# сколько фоновых воркеров разбирают очередь задач планировщика одновременно
worker_count: 2
# максимум одновременных HTTP-запросов ко всем источникам суммарно (фон + интерактив)
http_concurrency_global: 2
# отдельный слот для /search, вместо глобального пула (веер адаптеров идёт параллельно,
# поэтому 1 здесь заново сериализовал бы именно тот путь, где человек ждёт ответа)
http_concurrency_interactive: 2
# максимум одновременных запросов к одному источнику (не долбим один сайт параллельно)
http_concurrency_per_source: 1

# минимально допустимый интервал опроса маршрута в минутах (защита источников от долбёжки)
poll_interval_floor_min: 15
# интервал опроса по умолчанию, который бот предлагает при создании маршрута
poll_interval_default_min: 60

# сколько секунд считать ответ источника свежим и не запрашивать его снова
cache_ttl_s:
  travelpayouts: 10800      # TTL кэша Travelpayouts (3ч)
  yandex_rasp_schedule: 43200  # TTL кэша расписаний Яндекса (12ч, расписания почти не меняются)
  yandex_rasp_price: 7200   # TTL кэша цен Яндекса (2ч)
  airline_direct: 1800      # TTL кэша прямых сайтов авиакомпаний (30мин)
  rzd_direct: 2700          # TTL кэша РЖД-скрейпера (45мин)

# максимум комбинированных маршрутов через хаб, которые проверяются за один поиск
max_combo_candidates: 24
# максимально допустимое число пересадок в маршруте
max_hops_cap: 2

# гибкие даты (§6): сколько дат из окна проверяется за один цикл опроса источниками,
# которые умеют только одну дату за запрос (курсор прокручивает окно по циклам).
# Источники с пакетной выдачей (месяц за запрос) всегда получают всё окно целиком.
flex_probe_dates_per_cycle: 7
# то же для плеч маршрута через хаб — обе половины должны попадать на один день,
# поэтому широкое окно с обеих сторон только множит запросы впустую
flex_hub_probe_dates: 1
# сколько дат из окна щупает /search вживую — не про время ожидания (см.
# interactive_l1_deadline_s ниже), а про число запросов: без этого предела гибкое окно
# разлетелось бы на десятки запросов к источникам с ценой за одну дату
flex_search_probe_dates: 3

# сколько минут живёт сессия /search до истечения (после — «Поиск устарел»)
search_session_ttl_min: 30
# максимум одновременных сессий /search на одного пользователя
search_sessions_per_user_cap: 5

# потолок ожидания одного источника в /search. Больше не жёсткая отсечка — источник всё
# равно получает минимум свой честный total_timeout_s (см. registry._resolve_timeout_s),
# это значение может только поднять потолок выше, если хочется ждать ещё дольше, и отдельно
# ограничивает, сколько /search ждёт занятый рейт-лимит источника. Поднято с исходных 12с,
# когда пул egress'ов (см. ARCHITECTURE.md "Пул egress") сделал честный потолок источника
# регулярно больше 12с — старая жёсткая отсечка обрывала поиск именно в момент, когда
# повторная попытка через другой egress вот-вот сработала бы
interactive_l1_deadline_s: 240
# сколько секунд ждём мгновенный ответ из кэша в /search (первый проход)
interactive_l0_deadline_s: 1
# сколько секунд /search готов ждать освобождения лимита запроса к источнику, прежде чем пропустить его
interactive_bucket_wait_s: 2

# максимум уведомлений по одному маршруту в сутки (анти-спам)
notifications_per_route_per_day: 3
# минимальный интервал между повторными уведомлениями об одной и той же цене (часы)
notification_dedupe_cooldown_h: 12

# прокси для сессии бота с Telegram API (не для адаптеров-источников — те всегда напрямую).
# Нужен, если хостинг блокирует api.telegram.org (например VDS в России).
# null = без прокси. Пример: socks5://127.0.0.1:10808
telegram_proxy_url: null

# Пулы egress'ов (см. ARCHITECTURE.md "Прокси"). Каждый — упорядоченный список SOCKS5/HTTP
# прокси, по которым адаптер ротируется по мере того, как их банят; запись `null` означает
# собственный IP VDS без прокси вообще. Порядок = приоритет: сначала самое дешёвое и ни от
# чего внешнего не зависящее, домашний резидентский релей админа — последним, потому что он
# работает только пока включён личный компьютер. Пустой список = только напрямую (дефолт для
# локальной разработки). Один и тот же релей можно указывать во всех списках сразу — он просто
# форвардит TCP и не знает, чей это трафик.
#
# Ротация липкая: адаптер запоминает, какой egress сейчас считается рабочим, и начинает
# следующий вызов с него, а не перебирает список с начала каждый раз (повторно долбиться в
# только что забанивший источник — ровно то поведение, из-за которого VDS словила бан от
# tutu.ru). Забаненный egress уходит в остывание по лестнице circuit breaker'а (15мин → 1ч →
# 4ч), после чего снова становится доступен сам — так один плохой час не понижает источник
# до худшего egress'а навсегда. За один вызов адаптер тратит не больше двух попыток.
#
# aeroflot_direct: WAF банит по КЛАССУ адреса, поэтому российская геолокация сама по себе не
# спасает — "ru-bridge" (xray-outbound на самой VDS) физически в Москве, но с ASN хостинга,
# и блокируется через раз. Всё равно стоит первым: не зависит от домашнего компа. socks5h
# (не socks5) — www.aeroflot.ru не резолвится некоторыми VDS-резолверами, DNS тоже должен
# идти через прокси.
aeroflot_egress_pool: []
#  - socks5h://127.0.0.1:10809     # ru-bridge, локальный xray на VDS
#  - socks5h://100.x.x.x:11080     # домашний резидентский релей

# rzd_direct: сначала напрямую (`null`) — pass.rzd.ru банит IP самой VDS, но это снимется
# само, а проба ничего не стоит. "ru-bridge" сюда добавлять НЕЛЬЗЯ: проверено живьём, что
# РЖД эту подсеть не просто блокирует, а роняет в чёрную дыру — попытка висит до полного
# таймаута вместо ответа, то есть это самый дорогой возможный способ провалиться.
rzd_egress_pool: []
#  - null                          # напрямую с IP самой VDS
#  - socks5h://100.x.x.x:11080     # домашний резидентский релей

# pobeda_direct: тут ожидается ровно одна запись — домашний релей. У Победы явный
# VPN/датацентр-детектор («выключите VPN»), поэтому любой хостинговый egress бесполезен здесь
# по построению, а не «просто не проверен»: сама VDS и три VPN-выхода получили отказ,
# домашний ISP-адрес прошёл сразу. Ротироваться тут попросту не на что.
pobeda_egress_pool: []
#  - socks5h://100.x.x.x:11080     # домашний резидентский релей

# tutu_egress_pool — общий для tutu_rail_direct и tutu_avia_direct: одна платформа, одна
# инфраструктура, банятся вместе. Сначала напрямую (`null`) по той же причине, что у РЖД;
# затем парижский xray-outbound на самой VDS (проверен живьём: доставал tutu.ru, пока
# собственный IP VDS был зарейтлимичен, и в отличие от домашнего релея не требует, чтобы
# у кого-то был включён компьютер); домашний релей — последним. Блокировка Туту — молчаливый
# обрыв TCP вообще без HTTP-статуса, поэтому оба адаптера считают несостоявшееся соединение
# именно BLOCKED, а не ошибкой источника (см. adapters/base.is_egress_failure).
tutu_egress_pool: []
#  - null                          # напрямую с IP самой VDS
#  - socks5://127.0.0.1:10808      # xray-outbound с выходом в Париже (тот же, что telegram_proxy_url)
#  - socks5h://100.x.x.x:11080     # домашний резидентский релей
